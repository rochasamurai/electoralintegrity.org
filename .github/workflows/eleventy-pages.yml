name: Deploy Eleventy site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      URL: https://electoralintegrity.org

    steps:
      - name: Checkout production main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --include=dev

      - name: Build current production site
        run: npm run build

      - name: Checkout approved preview source
        uses: actions/checkout@v4
        with:
          repository: rochasamurai/electoralintegrity.org
          ref: elis-website-v2
          path: _elis_preview_source
          persist-credentials: false

      - name: Install preview dependencies
        working-directory: _elis_preview_source
        run: npm ci --include=dev

      - name: Build preview source
        working-directory: _elis_preview_source
        run: npm run build

      - name: Stage preview inside production artifact
        run: node scripts/stage-v2-preview.mjs _elis_preview_source/dist dist

      - name: Verify published structure
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/preview-2-0/index.html
          test -s dist/preview-2-0/en/index.html
          test -s dist/preview-2-0/pt/index.html
          test -s dist/preview-2-0/privacy/index.html
          grep -q 'noindex, nofollow' dist/preview-2-0/en/index.html
          grep -q 'href="/preview-2-0/pt/"' dist/preview-2-0/en/index.html
          grep -q 'href="/preview-2-0/en/"' dist/preview-2-0/pt/index.html
          grep -q 'orientation:landscape' dist/preview-2-0/pt/index.html

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
