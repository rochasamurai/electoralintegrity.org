name: Verify isolated ELIS v2 preview publication
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout proposed deployment change
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install production dependencies
        run: npm ci --include=dev
      - name: Build production
        run: npm run build
      - name: Save homepage checksum
        run: sha256sum dist/index.html > /tmp/elis-home.sha
      - name: Checkout v2 preview source
        uses: actions/checkout@v4
        with:
          repository: rochasamurai/electoralintegrity.org
          ref: elis-website-v2
          path: _elis_preview_source
          persist-credentials: false
      - name: Install preview dependencies
        working-directory: _elis_preview_source
        run: npm ci --include=dev
      - name: Build preview
        working-directory: _elis_preview_source
        run: npm run build
      - name: Stage and inspect preview
        run: |
          set -euo pipefail
          node scripts/stage-v2-preview.mjs _elis_preview_source/dist dist
          sha256sum -c /tmp/elis-home.sha
          test -s dist/preview-2-0/index.html
          test -s dist/preview-2-0/en/index.html
          test -s dist/preview-2-0/pt/index.html
          test -s dist/preview-2-0/privacy/index.html
          grep -q 'noindex, nofollow' dist/preview-2-0/en/index.html
          grep -q 'href="/preview-2-0/pt/"' dist/preview-2-0/en/index.html
          grep -q 'href="/preview-2-0/en/"' dist/preview-2-0/pt/index.html
          grep -q 'orientation:landscape' dist/preview-2-0/pt/index.html
          echo 'Production unchanged and preview staged successfully.'
